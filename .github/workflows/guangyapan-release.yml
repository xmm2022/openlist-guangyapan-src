name: GuangYaPan binary release

on:
  push:
    tags:
      - "guangyapan-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example guangyapan-v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
          - goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.13"

      - name: Setup web
        run: bash build.sh dev web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRONTEND_REPO: ${{ vars.FRONTEND_REPO }}

      - name: Build archive
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          built_at="$(date +'%F %T %z')"
          git_commit="$(git rev-parse --short HEAD)"
          ldflags="-w -s \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.BuiltAt=${built_at}' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.GitAuthor=xmm2022 <noreply@github.com>' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.GitCommit=${git_commit}' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.Version=${tag}' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.WebVersion=rolling'"
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH="${{ matrix.goarch }}" \
            go build -trimpath -tags=jsoniter -ldflags="${ldflags}" -o dist/openlist-guangyapan .
          tar -C dist -czf "openlist-guangyapan_linux_${{ matrix.goarch }}.tar.gz" openlist-guangyapan
          sha256sum "openlist-guangyapan_linux_${{ matrix.goarch }}.tar.gz" >"openlist-guangyapan_linux_${{ matrix.goarch }}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openlist-guangyapan-linux-${{ matrix.goarch }}
          path: |
            openlist-guangyapan_linux_${{ matrix.goarch }}.tar.gz
            openlist-guangyapan_linux_${{ matrix.goarch }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          make_latest: true
          files: release-assets/*
